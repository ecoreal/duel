name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: smoke (built-ins play a match)
        run: node bin/duel.js run builtin:greedy builtin:random --seed 42 --out demo-replay.json
      - name: replay integrity
        if: runner.os != 'Windows'
        run: node bin/duel.js frame demo-replay.json 5 --plain > /dev/null
