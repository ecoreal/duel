name: season
on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC — new ISO week, new seeds
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: run this week's season
        run: |
          mkdir -p results
          node bin/duel.js season builtin:greedy bots/greedy.mjs bots/adapt.mjs bots/patient.mjs builtin:random --out results/week.json
      - name: append history line
        run: |
          printf '%s — %s\n' "$(date -u +%G-W%V)" "$(node -e "const t=require('./results/week.json').table; console.log(t.slice(0,3).map(r=>r.name+' '+r.rating).join(' · '))")" >> results/history.md
      - name: commit results
        run: |
          git config user.name "duel-bot"
          git config user.email "duel-bot@users.noreply.github.com"
          git add results/
          git commit -m "🏆 season results $(date -u +%G-W%V) (automated)" || exit 0
          git push
